# DEMO: nRF51822 drawn as a two-double-column module (4 pin columns)
#
# Same wiring as teufel_e450_nrf51822.yaml, but the nRF51822 is defined inline
# as a custom device with EXPLICIT pin positions to mimic the physical
# Core51822-style module (two double-columns of castellated pads). This needs
# no code changes — pinviz already honours per-pin `position: {x, y}`.
#
# Trade-off (inherent to the 2-side label logic): pin labels always sit inside
# the box toward the nearest edge, so the two left columns label rightward and
# the two right columns label leftward. It reproduces the pad geometry but is
# not photo-real.
title: "Teufel E450 — nRF51822 as a 4-column module (Raspberry Pi Zero W)"
board: "raspberry_pi_zero_w"

devices:
  - name: "nRF51822"
    width: 340.0
    height: 210.0
    color: "#1F5FA8"
    pins:
      # Column 0 (far left, x=15) — the pads wired to the Pi
      - {name: "VDD", role: "3V3", position: {x: 15, y: 24}}
      - {name: "GND", role: "GND", position: {x: 15, y: 40}}
      - {name: "P0.00 Source", role: "GPIO", position: {x: 15, y: 56}}
      - {name: "P0.01 Enc A", role: "GPIO", position: {x: 15, y: 72}}
      - {name: "P0.03 Enc B", role: "GPIO", position: {x: 15, y: 88}}
      - {name: "P0.04 Pwr/Mute", role: "GPIO", position: {x: 15, y: 104}}
      - {name: "P0.09 LED2", role: "GPIO", position: {x: 15, y: 120}}
      # Column 1 (left inner, x=95)
      - {name: "P0.02", role: "GPIO", position: {x: 95, y: 24}}
      - {name: "P0.05", role: "GPIO", position: {x: 95, y: 40}}
      - {name: "P0.06", role: "GPIO", position: {x: 95, y: 56}}
      - {name: "P0.07", role: "GPIO", position: {x: 95, y: 72}}
      - {name: "P0.08", role: "GPIO", position: {x: 95, y: 88}}
      - {name: "P0.10", role: "GPIO", position: {x: 95, y: 104}}
      - {name: "P0.11", role: "GPIO", position: {x: 95, y: 120}}
      - {name: "P0.12", role: "GPIO", position: {x: 95, y: 136}}
      - {name: "P0.13 RX", role: "UART_RX", position: {x: 95, y: 152}}
      - {name: "P0.14 TX", role: "UART_TX", position: {x: 95, y: 168}}
      - {name: "P0.15", role: "GPIO", position: {x: 95, y: 184}}
      # Column 2 (right inner, x=245)
      - {name: "P0.16", role: "GPIO", position: {x: 245, y: 24}}
      - {name: "P0.17", role: "GPIO", position: {x: 245, y: 40}}
      - {name: "P0.18", role: "GPIO", position: {x: 245, y: 56}}
      - {name: "P0.19", role: "GPIO", position: {x: 245, y: 72}}
      - {name: "P0.20", role: "GPIO", position: {x: 245, y: 88}}
      - {name: "P0.21", role: "GPIO", position: {x: 245, y: 104}}
      - {name: "P0.22", role: "GPIO", position: {x: 245, y: 120}}
      - {name: "P0.23", role: "GPIO", position: {x: 245, y: 136}}
      - {name: "P0.24", role: "GPIO", position: {x: 245, y: 152}}
      - {name: "P0.25", role: "GPIO", position: {x: 245, y: 168}}
      - {name: "P0.26 XL2", role: "GPIO", position: {x: 245, y: 184}}
      # Column 3 (far right, x=325)
      - {name: "P0.27 XL1", role: "GPIO", position: {x: 325, y: 24}}
      - {name: "P0.28", role: "GPIO", position: {x: 325, y: 40}}
      - {name: "P0.29 LED1", role: "GPIO", position: {x: 325, y: 56}}
      - {name: "P0.30", role: "GPIO", position: {x: 325, y: 72}}
      - {name: "SCLK (SWDCLK)", role: "GPIO", position: {x: 325, y: 88}}
      - {name: "SDO (SWDIO)", role: "GPIO", position: {x: 325, y: 104}}
      - {name: "NC", role: "GPIO", position: {x: 325, y: 120}}
      - {name: "NC ", role: "GPIO", position: {x: 325, y: 136}}
      - {name: "GND (2)", role: "GND", position: {x: 325, y: 152}}
  - type: "audio_dac_shim"
    name: "Audio DAC SHIM"

connections:
  # nRF51822 power (module runs from the Pi's 3V3 rail)
  - from: {board_pin: 17}
    to: {device: "nRF51822", device_pin: "VDD"}
    net: "3V3"
  - from: {board_pin: 25}
    to: {device: "nRF51822", device_pin: "GND"}
    net: "GND"

  # nRF51822 control lines → Pi GPIO
  - from: {board_pin: 26}
    to: {device: "nRF51822", device_pin: "P0.00 Source"}
    net: "Source switch / pairing"
  - from: {board_pin: 24}
    to: {device: "nRF51822", device_pin: "P0.04 Pwr/Mute"}
    net: "Power / Mute / Encoder C"
  - from: {board_pin: 16}
    to: {device: "nRF51822", device_pin: "P0.01 Enc A"}
    net: "Encoder A"
  - from: {board_pin: 18}
    to: {device: "nRF51822", device_pin: "P0.03 Enc B"}
    net: "Encoder B"
  - from: {board_pin: 22}
    to: {device: "nRF51822", device_pin: "P0.09 LED2"}
    net: "LED2"

  # Audio DAC SHIM → Pi I2S bus
  - from: {board_pin: 12}
    to: {device: "Audio DAC SHIM", device_pin: "BCLK (GPIO18)"}
    net: "I2S BCLK"
  - from: {board_pin: 35}
    to: {device: "Audio DAC SHIM", device_pin: "LRCLK (GPIO19)"}
    net: "I2S LRCLK"
  - from: {board_pin: 40}
    to: {device: "Audio DAC SHIM", device_pin: "DIN (GPIO21)"}
    net: "I2S DATA"

show_legend: false
